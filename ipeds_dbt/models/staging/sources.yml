version: 2

sources:
  - name: ipeds
    config:
      meta:
        external_location: "../processed/{name}.parquet"
    tables:
      - name: enrollment
        identifier: Enrollment
        columns:
          - name: unitid
            data_tests:
              - not_null
      - name: institutions
        identifier: Institutions
        columns:
          - name: unitid
            data_tests:
              - not_null
